name: Deploy to Cloudflare Pages

# Builds the Astro site and pushes it to the Cloudflare Pages "awj" project
# on every push to main. Replaces the manual `wrangler pages deploy dist`
# ritual that previously had to be run from Andy's Mac.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # PUBLIC_* env vars are INLINED by Astro at build time, so they
          # must be present here — the Cloudflare Pages dashboard env vars
          # are only read by Functions at runtime, not by the static build.
          # GA_API_SECRET, BEEHIIV_*, RESEND_API_KEY, CONTACT_* stay in
          # Pages dashboard env vars (Functions runtime) and are not needed
          # at build time.
          PUBLIC_GA_MEASUREMENT_ID: G-T29B6L3211
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=awj --branch=main --commit-dirty=true
